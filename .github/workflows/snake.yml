name: Gerar Snake da Contribuição

on:
  schedule:
    # Roda todo dia às 03:00 UTC (meia-noite no horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  gerar-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
